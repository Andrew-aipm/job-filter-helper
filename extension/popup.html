<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>职位筛选助手</title>
<link rel="stylesheet" href="style.css">
<body class="popup">
<h2>职位列表采集助手</h2>
<p>先在 BOSS 网站筛选条件，再直接采集结果列表。滚动或翻页后可累积去重，再由 DeepSeek 匹配简历。</p>
<button id="capture">开始采集（最多 200 条）</button>
<button id="stopCollect">停止采集</button>
<button id="open">打开分析工作台</button>
<p id="status" role="status"></p>
<script src="popup.js"></script>
</body>
</html>
